t x="42" y="96" width="44" height="4" rx="2" fill="#24385A"/></g><g class="row r1"><rect x="12" y="112" width="22" height="22" rx="6" fill="#16304F"/><rect x="42" y="116" width="54" height="5" rx="2.5" fill="#3B5378"/><rect x="42" y="126" width="49" height="4" rx="2" fill="#24385A"/></g><g class="row r2"><rect x="12" y="142" width="22" height="22" rx="6" fill="#16304F"/><rect x="42" y="146" width="48" height="5" rx="2.5" fill="#3B5378"/><rect x="42" y="156" width="54" height="4" rx="2" fill="#24385A"/></g><g class="row r3"><rect x="12" y="172" width="22" height="22" rx="6" fill="#16304F"/><rect x="42" y="176" width="42" height="5" rx="2.5" fill="#3B5378"/><rect x="42" y="186" width="59" height="4" rx="2" fill="#24385A"/></g><rect x="44" y="200" width="40" height="4" rx="2" fill="#2A3B5C"/></g><circle cx="585" cy="70" r="4" fill="#13B9FD" opacity="0.7"/><circle cx="600" cy="210" r="3" fill="#13B9FD" opacity="0.5"/><circle cx="800" cy="245" r="5" fill="#13B9FD" opacity="0.4"/><circle cx="560" cy="150" r="2.5" fill="#13B9FD" opacity="0.6"/>
