<svg xmlns="http://www.w3.org/2000/svg" width="840" height="280" viewBox="0 0 840 280" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<style>.pulse{animation:p 6s ease-in-out infinite;transform-origin:700px 120px}@keyframes p{50%{opacity:.55;transform:scale(1.08)}}.row{opacity:1;animation:f 4s ease-in-out infinite}.r1{animation-delay:.4s}.r2{animation-delay:.8s}.r3{animation-delay:1.2s}@keyframes f{0%,100%{opacity:1}50%{opacity:.45}}</style>
